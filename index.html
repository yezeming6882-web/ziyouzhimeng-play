<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>自由之梦</title>
  <link rel="icon" type="image/png" href="./assets/ui/favicon.png" />
  <style>@font-face{font-family:InkCJK;src:url(./assets/fonts/ink.woff)format("woff");font-display:block}html,body{background:#1a1814;height:100%;margin:0;overflow:hidden}#game{width:100%;height:100%}#rotate-overlay{z-index:9999;color:#e8dcc4;letter-spacing:.22em;text-align:center;pointer-events:auto;background:radial-gradient(at 50% 42%,#483e2c59 0%,#0000 58%),radial-gradient(at 50% 100%,#00000073 0%,#0000 50%),#16130f;flex-direction:column;justify-content:center;align-items:center;font-family:InkCJK,Songti SC,STSong,Noto Serif SC,serif;display:none;position:fixed;inset:0}#rotate-overlay:before{content:"";pointer-events:none;border:1px solid #d2be962e;position:absolute;inset:18px}#rotate-overlay .rotate-card{flex-direction:column;align-items:center;gap:28px;padding:24px;display:flex;position:relative}#rotate-overlay .rotate-phone{opacity:.92;width:108px;height:108px}#rotate-overlay p{color:#efe4cb;text-shadow:0 1px 8px #0000008c;margin:0;font-size:20px;line-height:1.6}@media (orientation:portrait) and (pointer:coarse){#rotate-overlay{display:flex}}</style>
  <script type="module" crossorigin src="./assets/index-BvBjCy3E.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-overlay" aria-live="polite">
    <div class="rotate-card">
      <svg class="rotate-phone" viewBox="0 0 120 120" aria-hidden="true">
        <!-- 竖置手机轮廓 -->
        <rect x="40" y="18" width="40" height="68" rx="6" ry="6"
              fill="none" stroke="#e8dcc4" stroke-width="2.4"/>
        <circle cx="60" cy="78" r="2.2" fill="#e8dcc4"/>
        <rect x="54" y="23" width="12" height="2.2" rx="1.1" fill="#e8dcc4" opacity="0.7"/>
        <!-- 旋转箭头：提示横过来 -->
        <path d="M22 64c0-22 16-40 38-44"
              fill="none" stroke="#e8dcc4" stroke-width="2.2"
              stroke-linecap="round"/>
        <path d="M54 14 l8 8 -11 2 z" fill="#e8dcc4"/>
        <path d="M98 56c0 22-16 40-38 44"
              fill="none" stroke="#e8dcc4" stroke-width="2.2"
              stroke-linecap="round"/>
        <path d="M66 106 l-8-8 11-2 z" fill="#e8dcc4"/>
      </svg>
      <p>请将手机横过来游玩</p>
    </div>
  </div>
</body>
</html>
